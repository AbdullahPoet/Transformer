<svg width="1600" height="760" viewBox="0 0 1600 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F3D3E"/>
    </linearGradient>
    <linearGradient id="accent" x1="140" y1="100" x2="760" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 64px 'Segoe UI', Inter, Arial, sans-serif; fill: white; }
      .titleAccent { font: 800 64px 'Segoe UI', Inter, Arial, sans-serif; fill: url(#accent); }
      .subtitle { font: 400 24px 'Segoe UI', Inter, Arial, sans-serif; fill: #CBD5E1; }
      .small { font: 400 20px 'Segoe UI', Inter, Arial, sans-serif; fill: #94A3B8; }
      .bullet { font: 500 23px 'Consolas', 'SFMono-Regular', monospace; fill: #D1D5DB; }
      .chip { font: 600 21px 'Consolas', 'SFMono-Regular', monospace; fill: #D1D5DB; }
      .label { font: 600 20px 'Segoe UI', Inter, Arial, sans-serif; fill: #E2E8F0; }
      .boxText { font: 600 20px 'Consolas', 'SFMono-Regular', monospace; fill: white; }
      .boxTextMuted { font: 500 18px 'Consolas', 'SFMono-Regular', monospace; fill: #94A3B8; }
      .flowText { font: 700 20px 'Segoe UI', Inter, Arial, sans-serif; fill: #E5E7EB; }
      .flowSub { font: 500 16px 'Segoe UI', Inter, Arial, sans-serif; fill: #A5B4FC; }
    </style>
  </defs>

  <rect width="1600" height="760" rx="0" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="760" fill="url(#bg)"/>

  <!-- Decorative background glows -->
  <circle cx="180" cy="80" r="200" fill="#7C3AED" opacity="0.11"/>
  <circle cx="1350" cy="640" r="260" fill="#10B981" opacity="0.12"/>
  <circle cx="980" cy="360" r="220" fill="#2563EB" opacity="0.06"/>

  <!-- Left content -->
  <text x="110" y="115" class="title">Transformer</text>
  <text x="110" y="190" class="titleAccent">From Scratch.</text>

  <text x="110" y="255" class="subtitle">A step-by-step implementation of the Transformer architecture behind</text>
  <text x="110" y="293" class="subtitle">Attention Is All You Need for English → Bangla machine translation.</text>

  <!-- code style config box -->
  <rect x="110" y="345" rx="22" ry="22" width="720" height="124" fill="url(#boxGrad)" stroke="#23324D" filter="url(#softShadow)"/>
  <text x="138" y="390" class="boxTextMuted"># model configuration</text>
  <text x="138" y="430" class="boxText">d_model = 512   ·   heads = 8   ·   layers = 3 + 3</text>
  <text x="138" y="459" class="boxText">ffn = 2048   ·   params ≈ 22.57M   ·   max_len = 32</text>

  <!-- chips -->
  <g>
    <rect x="110" y="500" rx="24" ry="24" width="178" height="48" fill="#0F172A" stroke="#334155"/>
    <text x="143" y="531" class="chip">Tokenization</text>

    <rect x="304" y="500" rx="24" ry="24" width="166" height="48" fill="#0F172A" stroke="#334155"/>
    <text x="338" y="531" class="chip">Embeddings</text>

    <rect x="486" y="500" rx="24" ry="24" width="220" height="48" fill="#0F172A" stroke="#334155"/>
    <text x="518" y="531" class="chip">Positional Encoding</text>
  </g>

  <g>
    <rect x="110" y="566" rx="24" ry="24" width="212" height="48" fill="#0F172A" stroke="#334155"/>
    <text x="144" y="597" class="chip">Multi-Head Attention</text>

    <rect x="338" y="566" rx="24" ry="24" width="111" height="48" fill="#0F172A" stroke="#334155"/>
    <text x="371" y="597" class="chip">Encoder</text>

    <rect x="465" y="566" rx="24" ry="24" width="111" height="48" fill="#0F172A" stroke="#334155"/>
    <text x="499" y="597" class="chip">Decoder</text>

    <rect x="592" y="566" rx="24" ry="24" width="146" height="48" fill="#0F172A" stroke="#334155"/>
    <text x="624" y="597" class="chip">Translation</text>
  </g>

  <!-- Right bullets -->
  <circle cx="980" cy="134" r="6" fill="#C084FC"/>
  <text x="1000" y="142" class="bullet">Notebook 1 builds the tokenizer and vocabularies</text>

  <circle cx="980" cy="186" r="6" fill="#5EEAD4"/>
  <text x="1000" y="194" class="bullet">Notebook 2 learns 128-D English and Bangla embeddings</text>

  <circle cx="980" cy="238" r="6" fill="#5EEAD4"/>
  <text x="1000" y="246" class="bullet">Notebook 3 demonstrates sinusoidal positional encoding</text>

  <circle cx="980" cy="290" r="6" fill="#5EEAD4"/>
  <text x="1000" y="298" class="bullet">Notebook 4 implements the full encoder–decoder Transformer</text>

  <circle cx="980" cy="342" r="6" fill="#C084FC"/>
  <text x="1000" y="350" class="bullet">Training includes BLEU-4, exact match, and attention visualization</text>

  <!-- Architecture diagram -->
  <rect x="950" y="430" rx="20" ry="20" width="110" height="72" fill="#13203B" stroke="#334155"/>
  <text x="972" y="462" class="flowText">Input</text>
  <text x="973" y="486" class="flowSub">English</text>

  <path d="M1068 466 H1120" stroke="#94A3B8" stroke-width="3" />
  <path d="M1114 458 L1128 466 L1114 474" stroke="#94A3B8" stroke-width="3" fill="none"/>

  <rect x="1128" y="430" rx="20" ry="20" width="140" height="72" fill="#13203B" stroke="#334155"/>
  <text x="1147" y="462" class="flowText">Tokenizer</text>
  <text x="1159" y="486" class="flowSub">+ IDs</text>

  <path d="M1276 466 H1328" stroke="#94A3B8" stroke-width="3" />
  <path d="M1322 458 L1336 466 L1322 474" stroke="#94A3B8" stroke-width="3" fill="none"/>

  <rect x="1336" y="430" rx="20" ry="20" width="154" height="72" fill="#13203B" stroke="#334155"/>
  <text x="1363" y="462" class="flowText">Embeddings</text>
  <text x="1387" y="486" class="flowSub">128-D</text>

  <path d="M1020 540 H1070" stroke="#94A3B8" stroke-width="3" />
  <path d="M1064 532 L1078 540 L1064 548" stroke="#94A3B8" stroke-width="3" fill="none"/>

  <rect x="850" y="504" rx="20" ry="20" width="170" height="72" fill="#13203B" stroke="#334155"/>
  <text x="871" y="536" class="flowText">Positional</text>
  <text x="885" y="560" class="flowSub">Encoding</text>

  <rect x="1080" y="504" rx="20" ry="20" width="160" height="72" fill="#13203B" stroke="#334155"/>
  <text x="1100" y="536" class="flowText">Encoder</text>
  <text x="1098" y="560" class="flowSub">Self-Attention</text>

  <path d="M1248 540 H1298" stroke="#94A3B8" stroke-width="3" />
  <path d="M1292 532 L1306 540 L1292 548" stroke="#94A3B8" stroke-width="3" fill="none"/>

  <rect x="1306" y="504" rx="20" ry="20" width="160" height="72" fill="#13203B" stroke="#334155"/>
  <text x="1330" y="536" class="flowText">Decoder</text>
  <text x="1318" y="560" class="flowSub">Cross-Attention</text>

  <path d="M1386 584 V626 H1482" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M1476 618 L1490 626 L1476 634" stroke="#94A3B8" stroke-width="3" fill="none"/>

  <rect x="1490" y="590" rx="20" ry="20" width="92" height="72" fill="#13203B" stroke="#334155"/>
  <text x="1504" y="621" class="flowText">Output</text>
  <text x="1510" y="646" class="flowSub">Bangla</text>
</svg>
